# Default verdict thresholds from SPEC.md §6. Not read by any code yet in
# P0 (quote fidelity is P1, proposition support is P2) — exists per the repo
# layout (SPEC.md §15). SPEC.md §12 requires these be calibrated on half the
# evaluation set and reported on the other half in P4; any change here
# requires an ADR (SPEC.md header, change control).

quote_fidelity:          # SPEC.md §6.2
  verbatim_similarity: 0.97          # >= this -> VERBATIM / VERBATIM_WITH_PERMITTED_ALTERATIONS
  altered_similarity_min: 0.80       # 0.80-0.97 -> ALTERED
  paraphrase_semantic_similarity: 0.85  # below 0.80 alignment but >= this semantic sim -> PARAPHRASE_IN_QUOTES

proposition_support:     # SPEC.md §6.3
  confidence_min: 0.6                # below this -> UNVERIFIABLE
  contradicts_confidence_min: 0.75   # CONTRADICTS needs a higher bar than other verdicts

investigator:             # SPEC.md FR-INV-007 per-run budget
  max_searches: 3
  max_fetches: 5
  max_wall_time_seconds: 90
  # ADR-013: normalised case-name similarity must be corroborated by court,
  # year, or docket number before a recovered source is accepted.
  name_similarity_threshold: 0.80
  # The final discovery query stays within max_searches and is restricted to
  # an official host selected from the citation's court hint. Extend this map
  # deliberately as verified state-court sources are added to the eval set.
  official_search_domains:
    - court_hint: "new york"
      domain: www.nycourts.gov
    - court_hint: "n.y."
      domain: www.nycourts.gov
    - citation_marker: "ny slip op"
      domain: www.nycourts.gov

retrieval:                # SPEC.md FR-PRP-001
  top_k_paragraphs: 6
