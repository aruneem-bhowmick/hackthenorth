# Domains the investigator (apps/investigator, P3) is permitted to fetch from.
# CON-ACC-001 (SPEC.md §10). Not read by any code yet in P0 — the investigator
# doesn't run until P3 — but the file exists per the repo layout (SPEC.md §15).
#
# Denylist (config/denylist.yaml) takes precedence over this list (CON-ACC-002).

domains:
