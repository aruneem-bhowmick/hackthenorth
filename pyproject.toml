[project]
name = "pincite"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "apps/investigator",
    "packages/pipeline",
    "packages/verdicts",
]

[tool.uv.sources]
pincite-pipeline = { workspace = true }
pincite-verdicts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
