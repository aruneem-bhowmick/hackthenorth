[project]
name = "pincite-verdicts"
version = "0.1.0"
requires-python = ">=3.12"
description = "Verdict rules as pure functions (SPEC.md §6). Empty in P0 — populated starting P1/P2."
dependencies = [
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verdicts"]
