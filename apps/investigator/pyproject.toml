[project]
name = "pincite-investigator"
version = "0.1.0"
requires-python = ">=3.12"
description = "Stagehand/Browserbase integration for unresolved-citation fallback (SPEC.md FR-INV-*, P3). P0 only ships the ADR-005 smoke test; investigator logic itself starts in P3."
dependencies = [
    "stagehand>=4.1",
    "browserbase>=1.19",
    "pydantic-settings>=2.6",
    "truststore>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["investigator"]
