[project]
name = "pincite-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.0",
    "sentry-sdk>=2.18",
    "pydantic-settings>=2.6",
    "watchfiles>=1.0",
    "truststore>=0.9",
    "httpx>=0.27",
    "elasticsearch>=8.15",
    "pincite-pipeline",
    "pincite-verdicts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
