name: pincite

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pincite
      POSTGRES_PASSWORD: pincite
      POSTGRES_DB: pincite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pincite"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pincite:pincite@postgres:5432/pincite
      REDIS_URL: redis://redis:6379/0
      UPLOADS_DIR: /data/uploads
    volumes:
      - ./apps/api:/app
      - uploads_data:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Idempotent migration on every start keeps a fresh `docker compose up`
    # demoable without a separate manual migration step (hackathon dev flow).
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pincite:pincite@postgres:5432/pincite
      REDIS_URL: redis://redis:6379/0
      UPLOADS_DIR: /data/uploads
    volumes:
      - ./apps/worker:/app
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:

# Frontend (apps/web) intentionally NOT a service here — SPEC.md §4 P0 exit
# gate runs it locally via `npm run dev`, separate from `docker compose up`.
